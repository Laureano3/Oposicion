<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#E9EDEC;
  --paper:#FDFDFB;
  --ink:#16262B;
  --muted:#5B6B6E;
  --hair:#D6DBD8;
  --accent:#2F6F5E;
  --accent-dark:#1E4A3F;
  --accent-bg:#E1EEE9;
  --danger:#A23B3B;
  --danger-bg:#F5E4E2;
  --brass:#B08D57;
  --brass-bg:#F3ECDE;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:32px 16px 64px;
}

.wrap{ max-width:640px; margin:0 auto; }

.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 4px;
}

h1{
  font-family:'Source Serif 4', serif;
  font-weight:600;
  font-size:26px;
  margin:0 0 20px;
  color:var(--ink);
}

.filters{ margin-bottom:18px; }

.filter-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px;
}

.filter-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--muted);
  margin-right:4px;
  min-width:48px;
}

.chip{
  font-family:'Inter', sans-serif;
  font-size:12.5px;
  padding:5px 11px;
  border-radius:20px;
  border:1px solid var(--hair);
  background:var(--paper);
  color:var(--muted);
  cursor:pointer;
  transition:all 0.12s ease;
}

.chip:hover{ border-color:var(--accent); }

.chip.active{
  background:var(--accent-bg);
  border-color:var(--accent);
  color:var(--accent-dark);
  font-weight:500;
}

.stats-bar{
  display:flex;
  gap:8px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.stat-pill{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  padding:6px 10px;
  border:1px solid var(--hair);
  border-radius:6px;
  background:var(--paper);
  color:var(--muted);
  white-space:nowrap;
}

.stat-pill b{ color:var(--ink); font-weight:600; }

.progress-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:10px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--muted);
}

.card{
  position:relative;
  background:var(--paper);
  border:1px solid var(--hair);
  border-radius:4px;
  box-shadow: 0 1px 0 var(--hair), 0 8px 0 -6px rgba(0,0,0,0.04);
  padding:36px 32px 28px;
  min-height:300px;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
  background:var(--accent);
}

.card.tipo-dato::before{ background:var(--brass); }
.card.tipo-norma::before{ background:#3E5C8A; }

.card-tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--accent-dark);
  background:var(--accent-bg);
  display:inline-block;
  padding:3px 8px;
  border-radius:4px;
  margin-bottom:18px;
  width:fit-content;
}

.card.tipo-dato .card-tag{ color:#6E5527; background:var(--brass-bg); }
.card.tipo-norma .card-tag{ color:#2A3F60; background:#E3E9F2; }

.card-face{ flex:1; display:flex; flex-direction:column; }

.question{
  font-family:'Source Serif 4', serif;
  font-size:19px;
  line-height:1.5;
  color:var(--ink);
  margin:0;
  flex:1;
  white-space:pre-line;
}

.hint{
  font-family:'Inter', sans-serif;
  font-size:13px;
  color:var(--muted);
  margin-top:20px;
}

.answer-list{
  font-family:'Source Serif 4', serif;
  font-size:16.5px;
  line-height:1.65;
  margin:0;
  padding-left:20px;
  color:var(--ink);
}

.answer-list li{ margin-bottom:6px; }

.actions{ display:flex; gap:12px; margin-top:24px; }

.btn{
  flex:1;
  font-family:'Inter', sans-serif;
  font-weight:500;
  font-size:14px;
  padding:13px 16px;
  border-radius:6px;
  border:1px solid var(--hair);
  background:var(--paper);
  cursor:pointer;
  transition:transform 0.08s ease;
}

.btn:active{ transform:scale(0.98); }

.btn-danger{ border-color:var(--danger); color:var(--danger); background:var(--danger-bg); }
.btn-success{ border-color:var(--accent); color:var(--accent-dark); background:var(--accent-bg); }
.btn-flip{ width:100%; margin-top:24px; border-color:var(--ink); color:var(--ink); }

.kbd-note{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--muted);
  margin-top:12px;
}

.stamp{
  position:absolute;
  top:30px;
  right:28px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  border:2px solid;
  border-radius:50%;
  width:74px;
  height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.15;
  transform:rotate(8deg) scale(0);
  opacity:0;
  pointer-events:none;
}

.stamp.show{ animation: stamp-in 0.32s cubic-bezier(.2,1.4,.4,1) forwards; }

@keyframes stamp-in{
  0%{ transform:rotate(8deg) scale(2); opacity:0; }
  60%{ transform:rotate(8deg) scale(0.92); opacity:1; }
  100%{ transform:rotate(8deg) scale(1); opacity:1; }
}

.stamp-success{ color:var(--accent); border-color:var(--accent); }
.stamp-danger{ color:var(--danger); border-color:var(--danger); }

.empty-state{
  text-align:center;
  padding:60px 24px;
  background:var(--paper);
  border:1px solid var(--hair);
  border-radius:4px;
}

.empty-state h2{ font-family:'Source Serif 4', serif; font-size:20px; margin:0 0 8px; }
.empty-state p{ color:var(--muted); font-size:14px; margin:0 0 20px; }

.link-btn{
  font-family:'Inter', sans-serif;
  font-size:13px;
  color:var(--accent-dark);
  background:none;
  border:none;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
}

.footer-note{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  gap:14px 18px;
  justify-content:center;
  flex-wrap:wrap;
}

.footer-sep{
  color:var(--hair);
  user-select:none;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%) translateY(12px);
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter', sans-serif;
  font-size:13px;
  line-height:1.45;
  padding:11px 16px;
  border-radius:8px;
  max-width:min(90vw, 420px);
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.18s ease, transform 0.18s ease;
  z-index:50;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast-error{ background:var(--danger); }

.loading{
  text-align:center;
  padding:60px 0;
  color:var(--muted);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
}

@media (prefers-reduced-motion: reduce){
  .stamp.show{ animation:none; opacity:1; transform:rotate(8deg) scale(1); }
}
</style>

const TIPOS = ["Estructura", "Dato", "Norma", "Concepto", "Enlace"];
const STORAGE_KEY = "leitner-progreso-v2";
const LEGACY_KEY = "leitner-progreso";
const INTERVALS_DAYS = [0, 1, 3, 7, 14];
const MAX_BOX = 5;

let progress = {};
let queue = [];
let currentIndex = 0;
let flipped = false;
let studyAllMode = false;
let filterTema = "todos";
let filterTipo = "todos";

const app = document.getElementById("app");
const statsBar = document.getElementById("statsBar");
const resetRow = document.getElementById("resetRow");
const temaFilters = document.getElementById("temaFilters");
const tipoFilters = document.getElementById("tipoFilters");

function daysFromNow(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString();
}

function isDue(cardId){
  const p = progress[cardId];
  if(!p) return true;
  return new Date(p.nextDue).getTime() <= Date.now();
}

function boxOf(cardId){
  return progress[cardId] ? progress[cardId].box : 0;
}

function inFilter(c){
  const okTema = filterTema === "todos" || String(c.tema) === filterTema || c.tema === 0 && filterTema === "0";
  const okTipo = filterTipo === "todos" || c.tipo === filterTipo;
  return okTema && okTipo;
}

function filteredCards(){
  return CARDS.filter(inFilter);
}

async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    progress = raw ? JSON.parse(raw) : {};
  }catch(e){ progress = {}; }
  if(Object.keys(progress).length===0){
    try{
      const old=localStorage.getItem(LEGACY_KEY);
      if(old){
        progress=JSON.parse(old);
        await saveProgress();
      }
    }catch(e){}
  }
}

async function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    console.error("No se pudo guardar el progreso",e);
    if(typeof flash === "function"){
      flash("Este navegador no está guardando el progreso (¿modo incógnito?). Exporta antes de cerrar.", true);
    }
  }
}

function renderFilters(){
  const temas = [
    { v:"todos", l:"Todos" },
    { v:"1", l:"Tema 1" },
    { v:"2", l:"Tema 2" },
    { v:"0", l:"Transversal" }
  ];
  temaFilters.innerHTML = '<span class="filter-label">Tema</span>' + temas.map(t =>
    `<button class="chip ${filterTema===t.v?'active':''}" data-tema="${t.v}">${t.l}</button>`
  ).join("");

  tipoFilters.innerHTML = '<span class="filter-label">Tipo</span>' +
    `<button class="chip ${filterTipo==='todos'?'active':''}" data-tipo="todos">Todos</button>` +
    TIPOS.map(t => `<button class="chip ${filterTipo===t?'active':''}" data-tipo="${t}">${t}</button>`).join("");

  temaFilters.querySelectorAll("[data-tema]").forEach(btn => {
    btn.addEventListener("click", () => {
      filterTema = btn.dataset.tema;
      refresh();
    });
  });
  tipoFilters.querySelectorAll("[data-tipo]").forEach(btn => {
    btn.addEventListener("click", () => {
      filterTipo = btn.dataset.tipo;
      refresh();
    });
  });
}

function buildQueue(){
  const base = filteredCards();
  const source = studyAllMode ? base : base.filter(c => isDue(c.id));
  queue = [...source].sort(() => Math.random() - 0.5);
  currentIndex = 0;
}

function renderStats(){
  const set = filteredCards();
  const boxCounts = [0,0,0,0,0,0];
  set.forEach(c => { boxCounts[boxOf(c.id)]++; });
  const dueCount = set.filter(c => isDue(c.id)).length;

  statsBar.innerHTML = `
    <span class="stat-pill"><b>${set.length}</b> fichas en el mazo</span>
    <span class="stat-pill"><b>${dueCount}</b> pendientes hoy</span>
    <span class="stat-pill">Caja 1: <b>${boxCounts[0]+boxCounts[1]}</b></span>
    <span class="stat-pill">Caja 2: <b>${boxCounts[2]}</b></span>
    <span class="stat-pill">Caja 3: <b>${boxCounts[3]}</b></span>
    <span class="stat-pill">Caja 4: <b>${boxCounts[4]}</b></span>
    <span class="stat-pill">Dominadas: <b>${boxCounts[5]}</b></span>
  `;
}

function renderFooter(){
  resetRow.innerHTML = `
    <button class="link-btn" id="toggleAllBtn">${studyAllMode ? "Volver a modo pendientes" : "Repasar todas las fichas (ignorar fechas)"}</button>
    <span class="footer-sep">·</span>
    <button class="link-btn" id="exportBtn">Exportar progreso</button>
    <button class="link-btn" id="importBtn">Importar progreso</button>
    <span class="footer-sep">·</span>
    <button class="link-btn" id="resetBtn">Reiniciar progreso</button>
    <input type="file" id="importInput" accept="application/json,.json" style="display:none">
  `;
  document.getElementById("toggleAllBtn").addEventListener("click", () => {
    studyAllMode = !studyAllMode;
    buildQueue();
    renderCard();
  });
  document.getElementById("exportBtn").addEventListener("click", exportProgress);
  const importInput = document.getElementById("importInput");
  document.getElementById("importBtn").addEventListener("click", () => importInput.click());
  importInput.addEventListener("change", () => {
    const file = importInput.files && importInput.files[0];
    if(file) importProgress(file);
    importInput.value = "";
  });
  document.getElementById("resetBtn").addEventListener("click", async () => {
    if(confirm("¿Seguro que quieres borrar todo el progreso de repaso?")){
      progress = {};
      await saveProgress();
      studyAllMode = false;
      refresh();
      flash("Progreso borrado. Todas las fichas vuelven a la caja 1.");
    }
  });
}

/* ---------- Aviso emergente ---------- */
let toastTimer = null;

function flash(msg, isError){
  let el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = "toast show" + (isError ? " toast-error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast" + (isError ? " toast-error" : ""); }, 3600);
}

/* ---------- Exportar / importar progreso ---------- */
function exportProgress(){
  const n = Object.keys(progress).length;
  if(n === 0){
    flash("Todavía no hay progreso que exportar.", true);
    return;
  }
  const payload = {
    app: "fichas-ingenieros-industriales-estado",
    version: 2,
    exportadoEl: new Date().toISOString(),
    fichasEnElMazo: CARDS.length,
    progress: progress
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "progreso-fichas-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash("Progreso exportado: " + n + " fichas.");
}

function importProgress(file){
  const reader = new FileReader();

  reader.onerror = () => flash("No se pudo leer el fichero.", true);

  reader.onload = async () => {
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(e){
      flash("El fichero no es un JSON válido.", true);
      return;
    }

    const incoming = data && data.progress ? data.progress : data;
    if(!incoming || typeof incoming !== "object" || Array.isArray(incoming)){
      flash("El fichero no contiene un progreso reconocible.", true);
      return;
    }

    const validIds = new Set(CARDS.map(c => c.id));
    let nuevas = 0, actualizadas = 0, ignoradas = 0;

    Object.keys(incoming).forEach(id => {
      const p = incoming[id];
      const valido = p && typeof p.box === "number" && p.box >= 0 && p.box <= MAX_BOX &&
                     p.nextDue && !isNaN(new Date(p.nextDue).getTime());
      if(!validIds.has(id) || !valido){ ignoradas++; return; }

      const actual = progress[id];
      if(!actual){
        progress[id] = { box: p.box, nextDue: p.nextDue };
        nuevas++;
        return;
      }
      // Se conserva siempre el estado más avanzado: caja mayor y, a igual caja, la revisión más lejana.
      if(p.box > actual.box || (p.box === actual.box && new Date(p.nextDue) > new Date(actual.nextDue))){
        progress[id] = { box: p.box, nextDue: p.nextDue };
        actualizadas++;
      }
    });

    if(nuevas === 0 && actualizadas === 0){
      flash("Nada que importar: este dispositivo ya estaba igual o más avanzado.");
      return;
    }

    await saveProgress();
    refresh();
    flash("Importado: " + nuevas + " fichas nuevas, " + actualizadas + " actualizadas" +
          (ignoradas ? ", " + ignoradas + " ignoradas" : "") + ".");
  };

  reader.readAsText(file);
}

function renderCard(){
  renderFooter();
  if(currentIndex >= queue.length){
    renderEmptyState();
    return;
  }
  const card = queue[currentIndex];
  flipped = false;

  const tipoClass = card.tipo === "Dato" ? "tipo-dato" : (card.tipo === "Norma" ? "tipo-norma" : "");

  app.innerHTML = `
    <div class="progress-row">
      <span>Ficha ${currentIndex + 1} / ${queue.length}</span>
      <span>Caja actual: ${boxOf(card.id) || "nueva"}</span>
    </div>
    <div class="card ${tipoClass}" id="cardEl">
      <div class="stamp" id="stampEl"></div>
      <span class="card-tag">${card.tag}</span>
      <div class="card-face" id="cardFace">
        <p class="question" id="questionText"></p>
        <p class="hint">Piensa tu respuesta en voz alta antes de girar la ficha.</p>
      </div>
      <button class="btn btn-flip" id="flipBtn">Girar ficha</button>
    </div>
    <p class="kbd-note">Espacio: girar · ←: no me acuerdo · →: lo sé</p>
  `;

  document.getElementById("questionText").textContent = card.front;

  const cardEl = document.getElementById("cardEl");
  const flipBtn = document.getElementById("flipBtn");

  const doFlip = () => {
    if(flipped) return;
    flipped = true;
    showBack(card);
  };

  flipBtn.addEventListener("click", (e) => { e.stopPropagation(); doFlip(); });
  cardEl.addEventListener("click", doFlip);
}

function showBack(card){
  const cardFace = document.getElementById("cardFace");
  const listItems = card.back.map(item => `<li>${item}</li>`).join("");
  cardFace.innerHTML = `<ul class="answer-list">${listItems}</ul>`;

  const flipBtn = document.getElementById("flipBtn");
  flipBtn.outerHTML = `
    <div class="actions">
      <button class="btn btn-danger" id="failBtn">No me acuerdo</button>
      <button class="btn btn-success" id="passBtn">Lo sé</button>
    </div>
  `;

  document.getElementById("failBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    answer(card, false);
  });
  document.getElementById("passBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    answer(card, true);
  });
}

let answering = false;

async function answer(card, correct){
  if(answering) return;
  answering = true;

  const stampEl = document.getElementById("stampEl");
  if(stampEl){
    stampEl.textContent = correct ? "Lo sé" : "Repasar";
    stampEl.className = "stamp show " + (correct ? "stamp-success" : "stamp-danger");
  }

  const currentBox = boxOf(card.id);
  const newBox = correct ? Math.min(currentBox + 1, MAX_BOX) : 1;
  const interval = INTERVALS_DAYS[Math.max(newBox - 1, 0)];

  progress[card.id] = { box: newBox, nextDue: daysFromNow(interval) };
  await saveProgress();

  setTimeout(() => {
    currentIndex++;
    renderStats();
    renderCard();
    answering = false;
  }, 500);
}

function renderEmptyState(){
  const allDone = !studyAllMode;
  app.innerHTML = `
    <div class="empty-state">
      <h2>${allDone ? "Repaso de hoy completado" : "Fin de la ronda"}</h2>
      <p>${allDone ? "No quedan fichas pendientes en esta selección. Cambia de filtro, vuelve mañana o repasa todas otra vez." : "Has repasado el mazo completo con estos filtros."}</p>
      <button class="link-btn" id="againBtn">Repasar todas las fichas otra vez</button>
    </div>
  `;
  document.getElementById("againBtn").addEventListener("click", () => {
    studyAllMode = true;
    buildQueue();
    renderCard();
  });
}

document.addEventListener("keydown", (e) => {
  if(currentIndex >= queue.length) return;
  const card = queue[currentIndex];
  if(!card) return;

  if((e.key === " " || e.key === "Enter") && !flipped){
    e.preventDefault();
    flipped = true;
    showBack(card);
  } else if(flipped && (e.key === "ArrowLeft" || e.key === "1")){
    e.preventDefault();
    answer(card, false);
  } else if(flipped && (e.key === "ArrowRight" || e.key === "2")){
    e.preventDefault();
    answer(card, true);
  }
});

function refresh(){
  renderFilters();
  renderStats();
  buildQueue();
  renderCard();
}

async function init(){
  await loadProgress();
  refresh();
}

init();
</script>
